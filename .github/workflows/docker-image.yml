name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/flask-docker-app:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/flask-docker-app:latest

      - name: Run container
        run: |
          docker run -d -e PORT=8080 -p 8080:8080 --name test-container ${{ secrets.DOCKER_USERNAME }}/flask-docker-app:latest
          sleep 5
          curl -f http://localhost:8080/health
          docker stop test-container
          docker rm test-container

